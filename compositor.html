<!DOCTYPE html>

        const file = e.target.files[0];
        if (!file) return;
        setScreenshot(URL.createObjectURL(file));
        const img = new Image();
        img.onload = () => setScreenshotImg(img);
        img.src = URL.createObjectURL(file);
      };

        const file = e.dataTransfer.files[0];

        const img = new Image();
        img.onload = () => setScreenshotImg(img);
        img.src = URL.createObjectURL(file);
